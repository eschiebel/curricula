<svg width="32" height="32" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Book pages -->
  <path d="M30 70 Q40 60 50 70 Q60 60 70 70" fill="none" stroke="black" stroke-width="2"/>
  <!-- Book spine -->
  <line x1="50" y1="70" x2="50" y2="50" stroke="black" stroke-width="2"/>
  <!-- Central node -->
  <circle cx="50" cy="50" r="3" fill="black"/>
  <!-- Branching nodes -->
  <circle cx="35" cy="35" r="3" fill="black"/>
  <circle cx="65" cy="35" r="3" fill="black"/>
  <circle cx="50" cy="20" r="3" fill="black"/>
  <!-- Connections -->
  <line x1="50" y1="50" x2="35" y2="35" stroke="black" stroke-width="2"/>
  <line x1="50" y1="50" x2="65" y2="35" stroke="black" stroke-width="2"/>
  <line x1="50" y1="50" x2="50" y2="20" stroke="black" stroke-width="2"/>
</svg>
